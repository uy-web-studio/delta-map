name: Sync from Google Sheet

# Nightly at 3:15 a.m. Pacific (10:15 UTC; 11:15 during standard time is fine too),
# or run by hand from the Actions tab after approving a batch of rows.
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull approved rows
        if: ${{ vars.SHEET_ID != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m scripts.sync --sheet "${{ vars.SHEET_ID }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit changes
        run: |
          git config user.name "delta-map sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Sync from Google Sheet" && git push)

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
  # Rebuilding nightly also drops finished events from the static HTML.
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
